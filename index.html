<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://*.acsta.net; style-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciné">
<title>Ciné IDF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192-v1.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v1.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<canvas id="bg-shader" aria-hidden="true"></canvas>
<div id="app">
  <header id="topbar">
    <div class="title-row">
      <h1 id="page-title">Films</h1>
      <span id="version" class="badge-version"></span>
    </div>
    <div id="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Film, cinéma, ville…" autocomplete="off" enterkeyhint="search">
      </div>
      <div id="days" class="chips" role="tablist" aria-label="Jour"></div>
      <div id="quick" class="chips">
        <button class="chip toggle" data-f="cinepass" type="button"><span class="cp-dot"></span>CinéPass</button>
        <button class="chip toggle" data-f="vost" type="button">VOST</button>
        <button class="chip toggle" data-f="vf" type="button">VF</button>
        <button class="chip toggle" data-f="near" type="button">Près de moi</button>
        <button class="chip toggle" data-f="evening" type="button">Après 18 h</button>
        <button class="chip" id="more-filters" type="button">Filtres <span id="filter-count"></span></button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <section id="tab-films" class="tab"></section>
    <section id="tab-now" class="tab" hidden></section>
    <section id="tab-cinemas" class="tab" hidden></section>
    <section id="tab-settings" class="tab" hidden></section>
  </main>

  <nav id="tabs" aria-label="Onglets">
    <button data-tab="films" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Films</button>
    <button data-tab="now" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Bientôt</button>
    <button data-tab="cinemas" type="button"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Cinémas</button>
    <button data-tab="settings" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-grab" data-close></div>
    <button class="sheet-close" type="button" data-close aria-label="Fermer">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>
</body>
</html>
