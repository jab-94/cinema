# Aperçu : republie l'app tout de suite (lancement à la main), avec les DERNIÈRES séances lues par le robot
# (cache) ; la vieille copie de la branche « apercu-data » ne sert que s'il n'y a encore rien en cache.
name: Aperçu

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apercu
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Dernières séances du robot
        uses: actions/cache/restore@v4
        with:
          path: |
            data/days
            data/movies.json
            data/meta.json
            data/imdb-ids.json
          key: seances-${{ github.run_id }}
          restore-keys: seances-
      - name: Copie de secours (seulement si le robot n'a encore rien lu)
        if: hashFiles('data/meta.json') == ''
        run: |
          git fetch --depth 1 origin apercu-data
          git checkout FETCH_HEAD -- data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derniers jours (films qui quittent l'affiche)
        continue-on-error: true
        run: node scraper/update.mjs --postprocess
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html manifest.json service-worker.js css js vendor icons data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
